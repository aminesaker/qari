name: Build EAS

# Lance une compilation de l'appli sur les serveurs d'Expo (EAS).
# Prérequis : un secret EXPO_TOKEN dans Settings > Secrets and variables > Actions.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Profil (preview = APK à installer, production = stores)
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Crée le projet sur expo.dev au premier lancement (retrouvé ensuite grâce au slug).
      - run: eas init --non-interactive --force
      - run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --wait
